<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin}">Cosmetics Admin</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="adminNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin}">Tổng quan</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/admin/products}">Sản phẩm</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/orders}">Đơn hàng</a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Trang người dùng</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-warning" th:href="@{/logout}">Đăng xuất</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Danh sách sản phẩm</h2>
        <a class="btn btn-success" th:href="@{/admin/products/create}">Thêm sản phẩm</a>
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Tên</th>
            <th>Giá cơ bản</th>
            <th>Tồn kho</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${products}">
            <td th:text="${p.id}">1</td>
            <td th:text="${p.name}">Tên sản phẩm</td>
            <td th:text="${p.basePrice}">0</td>
            <td th:text="${p.stock}">0</td>
            <td>
                <a class="btn btn-sm btn-primary"
                   th:href="@{'/admin/products/edit/' + ${p.id}}">
                    Sửa
                </a>
                <form th:action="@{'/admin/products/delete/' + ${p.id}}"
                      method="post"
                      style="display:inline-block"
                      onsubmit="return confirm('Bạn có chắc muốn xóa sản phẩm này?');">
                    <button class="btn btn-sm btn-danger" type="submit">Xóa</button>
                </form>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(products)}">
            <td colspan="5" class="text-center text-muted">
                Chưa có sản phẩm nào.
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
