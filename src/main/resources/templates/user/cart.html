<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Cosmetics Store</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Trang chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/cart}">Giỏ hàng</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/orders}">Lịch sử mua hàng</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin}">Admin</a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/login}">Đăng nhập</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/logout}">Đăng xuất</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Giỏ hàng</h2>

    <!-- Giỏ trống -->
    <div th:if="${#lists.isEmpty(items)}" class="alert alert-info">
        Giỏ hàng của bạn đang trống.
    </div>

    <!-- Có item trong giỏ -->
    <form th:if="${!#lists.isEmpty(items)}"
          th:action="@{/cart/update}" method="post">

        <table class="table align-middle">
            <thead>
            <tr>
                <th style="width: 40px;"></th>
                <th>Sản phẩm</th>
                <th>Biến thể</th>
                <th class="text-center">Số lượng</th>
                <th class="text-end">Đơn giá</th>
                <th class="text-end">Thành tiền</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${items}">
                <td>
                    <input type="checkbox"
                           name="selectedIds"
                           th:value="${item.id}">
                </td>
                <td th:text="${item.productSku.product.name}">Tên sản phẩm</td>
                <td th:text="${item.productSku.volume}">Biến thể</td>
                <td class="text-center" th:text="${item.quantity}">1</td>
                <td class="text-end" th:text="${item.productSku.price}">0</td>
                <td class="text-end"
                    th:text="${item.productSku.price * item.quantity}">0</td>
            </tr>
            </tbody>
        </table>

        <div class="mt-3">
            <button class="btn btn-danger" type="submit"
                    name="action" value="delete">
                Xóa sản phẩm đã chọn
            </button>
            <button class="btn btn-success ms-2" type="submit"
                    name="action" value="checkout">
                Thanh toán sản phẩm đã chọn
            </button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
