<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Lịch sử mua hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <!-- giống nav ở các trang trên -->
    ...
</nav>

<div class="container mt-4">
    <h2>Đơn hàng của tôi</h2>

    <div th:if="${#lists.isEmpty(orders)}" class="alert alert-info">
        Bạn chưa có đơn hàng nào.
    </div>
<form class="row g-2 mb-3" method="get" th:action="@{/orders}">
    <!-- Tìm theo tên sản phẩm -->
    <div class="col-md-4">
        <input type="text" class="form-control"
               name="keyword"
               placeholder="Tìm theo tên sản phẩm"
               th:value="${keyword}">
    </div>

    <!-- Lọc theo loại da -->
    <div class="col-md-3">
        <select class="form-select" name="skinType">
            <option value="">Tất cả loại da</option>
            <option value="da dầu" th:selected="${skinType == 'da dầu'}">Da dầu</option>
            <option value="da khô" th:selected="${skinType == 'da khô'}">Da khô</option>
            <option value="mọi loại da" th:selected="${skinType == 'mọi loại da'}">Mọi loại da</option>
        </select>
    </div>

    <!-- Lọc theo khoảng giá -->
    <div class="col-md-2">
        <input type="number" class="form-control"
               name="minPrice"
               placeholder="Giá từ"
               th:value="${minPrice}">
    </div>

    <div class="col-md-2">
        <input type="number" class="form-control"
               name="maxPrice"
               placeholder="Giá đến"
               th:value="${maxPrice}">
    </div>

    <div class="col-md-1 d-grid">
        <button class="btn btn-primary" type="submit">Lọc</button>
    </div>
</form>

    <table th:if="${!#lists.isEmpty(orders)}" class="table">
        <thead>
        <tr>
            <th>Mã</th>
            <th>Ngày đặt</th>
            <th>Trạng thái</th>
            <th>Tổng tiền</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="o : ${orders}">
            <td th:text="${o.id}">1</td>
            <td th:text="${o.orderDate}">2024-01-01</td>
            <td th:text="${o.status}">PENDING</td>
            <td th:text="${o.totalAmount}">0</td>
        </tr>
        </tbody>
    </table>
    <div class="mt-3">
    <a class="btn btn-secondary" th:href="@{/}">
        Quay lại trang chủ
    </a>
</div>
    
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
