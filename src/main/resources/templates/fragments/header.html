<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title} ?: 'Cosmetics Store'">Cosmetics Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Cosmetics Store</a>
        <form class="d-flex" th:action="@{/}" method="get">
            <input class="form-control me-2" type="search" placeholder="Tìm kiếm sản phẩm"
                   name="keyword" th:value="${keyword}">
            <button class="btn btn-outline-success" type="submit">Tìm</button>
        </form>
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/cart}">Giỏ hàng</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/orders}">Đơn hàng</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin}">Admin</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/login}">Đăng nhập</a>
            </li>
        </ul>
    </div>
</nav>
<div class="container mt-4">
