<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ - Cosmetics Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Cosmetics Store</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/}">Trang chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/cart}">Giỏ hàng</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/orders}">Lịch sử mua hàng</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin}">Admin</a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto">
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/login}">Đăng nhập</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/logout}">Đăng xuất</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1 class="mb-4">Danh sách sản phẩm</h1>

    <!-- Form tìm kiếm -->
    <form class="row g-2 mb-3" method="get" th:action="@{/}">
        <div class="col-md-4">
            <input type="text"
                   class="form-control"
                   name="keyword"
                   placeholder="Tìm sản phẩm theo tên..."
                   th:value="${keyword}">
        </div>
        <div class="col-md-2 d-grid">
            <button class="btn btn-outline-primary" type="submit">Tìm kiếm</button>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(products)}" class="alert alert-info">
        Hiện chưa có sản phẩm nào.
    </div>

    <div class="row" th:if="${!#lists.isEmpty(products)}">
        <div class="col-md-3 mb-4" th:each="p : ${products}">
            <div class="card h-100">
                <img th:src="${p.thumbnailUrl}" class="card-img-top" alt="image">
                <div class="card-body">
                    <h5 class="card-title" th:text="${p.name}">Tên sản phẩm</h5>
                    <p class="card-text"
                       th:text="${p.brand != null ? p.brand.name : 'Không rõ thương hiệu'}"></p>
                    <p class="card-text">
                        <span th:text="${p.basePrice}">0</span> đ
                    </p>

                    <a th:href="@{'/products/' + ${p.id}}" class="btn btn-primary">Xem chi tiết</a>

                    <!-- Thêm vào giỏ: lấy SKU đầu tiên nếu có -->
                    <form th:if="${!#lists.isEmpty(p.skus)}"
                          th:action="@{/cart/add}" method="post" class="mt-2">
                        <input type="hidden" name="skuId" th:value="${p.skus[0].id}"/>
                        <input type="hidden" name="quantity" value="1"/>
                        <button class="btn btn-success btn-sm" type="submit">Thêm vào giỏ</button>
                    </form>

                    <!-- Nếu chưa có SKU, dùng add-default -->
                    <form th:if="${#lists.isEmpty(p.skus)}"
                          th:action="@{/cart/add-default}" method="post" class="mt-2">
                        <input type="hidden" name="productId" th:value="${p.id}"/>
                        <input type="hidden" name="quantity" value="1"/>
                        <button class="btn btn-success btn-sm" type="submit">Thêm vào giỏ</button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
