<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin}">Cosmetics Admin</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/}">Trang user</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/logout}">Đăng xuất</a></li>
        </ul>
    </div>
</nav>

<div class="container mt-4">
    <h2 th:text="${product.id == null} ? 'Thêm sản phẩm' : 'Chỉnh sửa sản phẩm'">Form sản phẩm</h2>

    <form th:action="@{/admin/products/save}" th:object="${product}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Tên sản phẩm</label>
            <input type="text" class="form-control" th:field="*{name}" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Mô tả</label>
            <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Loại da phù hợp</label>
            <input type="text" class="form-control" th:field="*{skinType}"/>
        </div>
        <div class="mb-3">
    <label class="form-label">Số lượng tồn kho</label>
    <input type="number" class="form-control"
           name="stock" min="0"
           th:value="${product.stock}">
</div>
        

        <div class="mb-3">
            <label class="form-label">Giá cơ bản</label>
            <input type="number" step="0.01" class="form-control" th:field="*{basePrice}" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Ảnh sản phẩm (URL)</label>
            <input type="text" class="form-control" th:field="*{thumbnailUrl}"/>
            <div class="form-text">Dán link ảnh từ Firebase / Imgur / v.v.</div>
        </div>

        <button class="btn btn-primary" type="submit">Lưu</button>
        <a class="btn btn-secondary" th:href="@{/admin/products}">Quay lại</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
